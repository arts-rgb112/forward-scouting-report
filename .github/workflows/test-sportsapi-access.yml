name: Test SportsAPI access

on:
  workflow_dispatch:

jobs:
  probe-status:
    runs-on: ubuntu-latest
    steps:
      - name: Probe account status without exposing credentials
        env:
          ALL_LEAGUES_KEY: ${{ secrets.SPORTSAPIPRO_ALL_LEAGUES_API_KEY }}
          TOURNAMENT_KEY: ${{ secrets.SPORTSAPIPRO_TOURNAMENT_API_KEY }}
          PLAYER_KEY: ${{ secrets.SPORTSAPIPRO_API_KEY }}
        run: |
          set -u
          status_url="https://api.sportsapipro.com/v2/football/status"

          probe_status() {
            name="$1"
            key="$2"
            body_file="$(mktemp)"
            trap 'rm -f "$body_file"' RETURN

            status="$(curl --silent --show-error --max-time 20 --output "$body_file" --write-out "%{http_code}" --header "x-api-key: $key" "$status_url")"
            echo "$name: HTTP $status"

            if test "$status" = "402" -o "$status" = "429"; then
              echo "HALTED: $name returned HTTP $status; no further probes will run."
              exit 0
            fi

            if test "$status" -ge 200 -a "$status" -lt 300; then
              python3 - "$name" "$body_file" <<'PY'
          import json
          import sys

          name, path = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          root = payload.get("data", payload) if isinstance(payload, dict) else {}
          account = root.get("account", {}) if isinstance(root, dict) else {}
          usage = root.get("usage", {}) if isinstance(root, dict) else {}
          print(
              f"{name}: plan={account.get('plan')} "
              f"daily_limit={usage.get('daily_limit')} "
              f"remaining={usage.get('remaining')} "
              f"requests_today={usage.get('requests_today')} "
              f"reset_at={usage.get('reset_at')}"
          )
          PY
            else
              echo "$name: status unavailable; response body intentionally not logged."
              failed=1
            fi

            rm -f "$body_file"
            trap - RETURN
          }

          failed=0
          probe_status "all-leagues" "$ALL_LEAGUES_KEY"
          probe_status "tournament" "$TOURNAMENT_KEY"
          probe_status "player" "$PLAYER_KEY"
          exit "$failed"
