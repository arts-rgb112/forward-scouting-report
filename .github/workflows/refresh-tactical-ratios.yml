name: Refresh tactical ratios

on:
  workflow_dispatch:
    inputs:
      season_name:
        description: Season label used by SportsAPI discovery (for example 2025/2026)
        required: true
        default: "2025/2026"
      season_names:
        description: Optional comma-separated batch of seasons, processed sequentially
        required: false
        default: ""
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ETL can run for a while; retain enough history to rebase its
          # generated-data commit if another deployment lands meanwhile.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Heat Ratio CSV
        env:
          SPORTSAPIPRO_ALL_LEAGUES_API_KEY: ${{ secrets.SPORTSAPIPRO_ALL_LEAGUES_API_KEY }}
          SPORTSAPIPRO_TOURNAMENT_API_KEY: ${{ secrets.SPORTSAPIPRO_TOURNAMENT_API_KEY }}
          SPORTSAPIPRO_API_KEY: ${{ secrets.SPORTSAPIPRO_API_KEY }}
        run: |
          seasons="${{ inputs.season_names }}"
          if [ -z "$seasons" ]; then
            seasons="${{ inputs.season_name || '2025/2026' }}"
          fi
          IFS=',' read -ra season_list <<< "$seasons"
          for raw_season in "${season_list[@]}"; do
            season="$(echo "$raw_season" | xargs)"
            [ -n "$season" ] || continue
            echo "Refreshing tactical data for $season"
            python scripts/build_tactical_ratios.py --season-name "$season"
          done
      - name: Commit refreshed static data
        # Each completed competition is checkpointed by the ETL.  Persist that
        # work even when a later competition reaches the API quota, so the next
        # run resumes from the last durable season/tournament checkpoint.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tactical_3zone_ratio.csv data/tactical_heatmap_points.json data/unmatched_sportsapi_players.csv data/auto_matched_fotmob_players.csv
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "Refresh tactical Heat Ratios"

          # A manual deployment or PR merge may have updated main while the
          # lengthy API batch was running. Rebase the data-only commit onto
          # the latest main before publishing instead of losing the batch.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
