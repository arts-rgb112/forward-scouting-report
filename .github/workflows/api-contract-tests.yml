name: API contract tests

on:
  pull_request:
    paths:
      - "api_server/**"
      - "rankings.py"
      - "metrics.py"
      - "requirements-api.txt"
      - "tests/**"
      - "docs/fixtures/**"
      - ".github/workflows/api-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Run strict API and compatibility contracts
        run: >-
          python -m pytest -q
          tests/test_duel_press_detail_readouts.py
          tests/test_duel_press_contract.py
          tests/test_duel_pressing.py
          tests/test_metric_ranks_contract.py
          tests/test_volume_benchmark_contract.py
          tests/test_tactical_summary_ratio_benchmark_contract.py
          tests/test_api.py
