name: Enrich tactical spatial metrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enrich saved heatmap sessions without API calls
        run: python scripts/enrich_tactical_spatial_metrics.py
      - name: Commit enriched tactical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tactical_3zone_ratio.csv
          git diff --cached --quiet || git commit -m "data: enrich S.P.E.A.R. spatial metrics"
          git push
