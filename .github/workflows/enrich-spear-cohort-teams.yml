name: Enrich S.P.E.A.R. cohort teams

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cohort dependencies
        run: pip install -r requirements.txt
      - name: Enrich team names from bulk league tables
        run: python scripts/enrich_spear_cohort_teams.py
      - name: Commit enriched cohort
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spear_cohort.csv
          git diff --cached --quiet || git commit -m "data: enrich S.P.E.A.R. cohort teams"
          git push
