name: Refresh S.P.E.A.R. cohorts

on:
  workflow_dispatch:
    inputs:
      season_name:
        description: Competition season to cache
        required: true
        default: "2025/2026"
      season_names:
        description: Optional comma-separated batch of seasons, processed sequentially
        required: false
        default: ""
      competitions:
        description: Optional comma-separated competition labels; leave blank to refresh all supported competitions
        required: false
        default: ""
  schedule:
    - cron: "45 4 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cohort dependencies
        run: pip install -r requirements.txt
      - name: Build static S.P.E.A.R. cohort CSV
        run: |
          seasons="${{ inputs.season_names }}"
          if [ -z "$seasons" ]; then
            seasons="${{ inputs.season_name || '2025/2026' }}"
          fi
          competition_args=()
          competitions="${{ inputs.competitions }}"
          if [ -n "$competitions" ]; then
            IFS=',' read -ra competition_list <<< "$competitions"
            for raw_competition in "${competition_list[@]}"; do
              competition="$(echo "$raw_competition" | xargs)"
              [ -n "$competition" ] && competition_args+=("$competition")
            done
          fi
          IFS=',' read -ra season_list <<< "$seasons"
          for raw_season in "${season_list[@]}"; do
            season="$(echo "$raw_season" | xargs)"
            [ -n "$season" ] || continue
            echo "Refreshing S.P.E.A.R. cohort for $season"
            if [ "${#competition_args[@]}" -gt 0 ]; then
              python scripts/build_spear_cohort.py --season-name "$season" --competitions "${competition_args[@]}"
            else
              python scripts/build_spear_cohort.py --season-name "$season"
            fi
          done
      - name: Commit static cohort
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spear_cohort.csv
          if git diff --cached --quiet; then
            echo "No cohort changes to commit."
            exit 0
          fi
          git commit -m "Refresh S.P.E.A.R. cohorts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
