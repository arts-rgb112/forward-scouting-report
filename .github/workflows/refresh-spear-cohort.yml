name: Refresh S.P.E.A.R. cohorts

on:
  workflow_dispatch:
    inputs:
      season_name:
        description: Competition season to cache
        required: true
        default: "2025/2026"
  schedule:
    - cron: "45 4 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build static S.P.E.A.R. cohort CSV
        run: python scripts/build_spear_cohort.py --season-name "${{ inputs.season_name || '2025/2026' }}"
      - name: Commit static cohort
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spear_cohort.csv
          if git diff --cached --quiet; then
            echo "No cohort changes to commit."
            exit 0
          fi
          git commit -m "Refresh S.P.E.A.R. cohorts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
