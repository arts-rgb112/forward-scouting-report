name: Refresh shotmap points

on:
  workflow_dispatch:
    inputs:
      season_name:
        description: Season to snapshot (for example 2025/2026)
        required: true
        default: "2025/2026"
      refresh_existing:
        description: Refetch existing sessions for a deterministic trajectory backfill
        required: true
        type: boolean
        default: false
      workers:
        description: Safe bounded player-season workers
        required: true
        type: choice
        options:
          - "1"
          - "3"
        default: "3"

concurrency:
  group: shotmap-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snapshot exact FotMob shot coordinates
        id: snapshot
        continue-on-error: true
        shell: bash
        run: |
          args=(--season-name "${{ inputs.season_name }}" --workers "${{ inputs.workers }}")
          if [[ "${{ inputs.refresh_existing }}" == "true" ]]; then
            args+=(--refresh-existing)
          fi
          python scripts/build_shotmap_points.py "${args[@]}"
      - name: Audit all tactical sessions
        if: always()
        run: python scripts/audit_shotmap_coverage.py
      - name: Commit shotmap snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The audit report is diagnostic output. Leaving it dirty prevents
          # rebase, and committing it from parallel season jobs causes conflicts.
          git restore data/missing_shotmap_sessions.csv
          git add data/tactical_shotmap_points*.json
          if git diff --cached --quiet; then
            echo "No shotmap changes to commit."
            exit 0
          fi
          git commit -m "Refresh static shotmap points"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent push detected; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "Could not publish the snapshot after 5 attempts."
          exit 1
      - name: Report snapshot failure after preserving checkpoints
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "The snapshot process failed, but checkpointed data was published. Re-run this season to resume."
          exit 1
