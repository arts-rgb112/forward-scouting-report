name: Refresh shotmap points

on:
  workflow_dispatch:
    inputs:
      season_name:
        description: Season to snapshot (for example 2025/2026)
        required: true
        default: "2025/2026"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snapshot exact FotMob shot coordinates
        run: python scripts/build_shotmap_points.py --season-name "${{ inputs.season_name }}"
      - name: Audit all tactical sessions
        run: python scripts/audit_shotmap_coverage.py
      - name: Commit shotmap snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tactical_shotmap_points*.json
          if git diff --cached --quiet; then
            echo "No shotmap changes to commit."
            exit 0
          fi
          git commit -m "Refresh static shotmap points"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
