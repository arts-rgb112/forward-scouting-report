# Reference metadata only: no Render Blueprint instance currently consumes this
# file. The live Render dashboard is authoritative; keep these fields in sync
# with it so a future Blueprint connection does not recreate stale settings.
services:
  - type: web
    name: forward-scouting-report
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api_server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MESSI_CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://forward-scouting-report-6dn7-tau.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
